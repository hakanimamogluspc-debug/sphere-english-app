providers = []

[variables]
NODE_ENV = "production"
PORT = "3000"

[phases.setup]
nixPkgs = ["nodejs_20", "ffmpeg"]
cmds = ["npm install -g pnpm@9"]

[phases.install]
dependsOn = ["setup"]
cmds = ["pnpm install --frozen-lockfile"]

[phases.build]
dependsOn = ["install"]
cmds = ["pnpm --filter @workspace/api-server build"]

[start]
cmd = "node -e \"const{Pool}=require('pg');const p=new Pool({connectionString:process.env.DATABASE_URL});p.query('ALTER TABLE users ADD COLUMN IF NOT EXISTS student_number VARCHAR(20)').then(()=>p.query('ALTER TABLE quizzes ADD COLUMN IF NOT EXISTS level VARCHAR(10)')).then(()=>{console.log('migrations ok');p.end();}).catch(e=>{console.error('migration warn:',e.message);p.end();})\" 2>/dev/null; node -e \"const{Pool}=require('pg');const p=new Pool({connectionString:process.env.DATABASE_URL});const levels=['A1','A2','B1','B2','C1','C2'];const titles={'A1':'A1 Seviyesi - Temel Alıştırmalar','A2':'A2 Seviyesi - Temel Alıştırmalar','B1':'B1 Seviyesi - Orta Seviye Alıştırmalar','B2':'B2 Seviyesi - Orta-Üstü Alıştırmalar','C1':'C1 Seviyesi - İleri Alıştırmalar','C2':'C2 Seviyesi - Yetkinlik Alıştırmaları'};const limits={'A1':15,'A2':15,'B1':20,'B2':20,'C1':25,'C2':25};const passing={'A1':60,'A2':60,'B1':65,'B2':65,'C1':70,'C2':70};const questions={'A1':[['Hello, I ___ a student at Sphere English.',['is','are','am','be'],'am'],['___ your name?',['Who','What\\'s','Where','How'],'What\\'s'],['She ___ in London.',['live','living','lives','is live'],'lives'],['There are two ___ on the desk.',['book','books','bookes','a book'],'books'],['___ you speak English?',['Do','Does','Are','Is'],'Do'],['I don\\'t have ___ money.',['some','any','a','many'],'any'],['My brother ___ a new car.',['have','having','has','is have'],'has'],['We go to the gym ___ Tuesdays.',['in','at','on','to'],'on'],['Where ___ they from?',['is','are','am','do'],'are'],['I ___ coffee, but I love tea.',['doesn\\'t like','am not like','not like','don\\'t like'],'don\\'t like']],'A2':[['Last night, we ___ to the cinema.',['go','went','gone','going'],'went'],['Is this book ___?',['you','your','yours','you\\'re'],'yours'],['London is ___ than Istanbul.',['more expensive','expensive','most expensive','expensiver'],'more expensive'],['I was late because I ___ my bus.',['lose','lost','missed','miss'],'missed'],['Have you ___ been to Germany?',['never','ever','yet','already'],'ever'],['I think it ___ rain tomorrow.',['will','is','going to','shall'],'will'],['___ you watching TV when I called?',['Did','Was','Were','Are'],'Were'],['I enjoy ___ books in the evening.',['read','to read','reading','to reading'],'reading'],['She told me ___ wait outside.',['not','to','not to','for'],'not to'],['He ___ here for 5 years now.',['works','has worked','is working','worked'],'has worked']],'B1':[['If I ___ you, I would apologize.',['am','was','were','be'],'were'],['The letter ___ by the manager.',['write','wrote','was written','is write'],'was written'],['Despite ___ tired, she finished the project.',['be','been','being','was'],'being'],['He denied ___ the money.',['to take','taking','taken','take'],'taking'],['I wish I ___ harder at school.',['study','studied','had studied','have studied'],'had studied'],['She ___ the task by noon.',['will finish','will have finished','is finishing','finishes'],'will have finished'],['The manager, ___ I spoke yesterday, is very helpful.',['which','whom','who','that'],'whom'],['They are looking forward ___ you.',['to meet','meeting','to meeting','meet'],'to meeting'],['You ___ have told me earlier!',['could','should','must','might'],'should'],['___ having a degree, she lacks experience.',['Despite','Although','However','Nevertheless'],'Despite']],'B2':[['Had she known about the meeting, she ___ attended.',['would','will have','would have','had'],'would have'],['The results were ___ surprising that everyone applauded.',['such','so','very','too'],'so'],['No sooner ___ sat down than the phone rang.',['had I','I had','have I','did I'],'had I'],['It is imperative that he ___ on time.',['is','be','was','will be'],'be'],['She ___ to resign unless conditions improve.',['threatens','is threatening','threatened','has threatened'],'is threatening'],['The proposal was turned ___ by the committee.',['away','down','back','off'],'down'],['He spoke with such ___ that everyone b