[variables]
NODE_ENV = "production"
PORT = "8080"

[phases.setup]
nixPkgs = ["nodejs_20"]

[phases.install]
cmds = ["npm install -g pnpm@9 --silent", "pnpm install --frozen-lockfile"]

[phases.build]
cmds = ["pnpm --filter @workspace/api-server build"]

[start]
cmd = "node --enable-source-maps artifacts/api-server/dist/index.mjs"
