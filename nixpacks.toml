providers = []

[variables]
NODE_ENV = "production"
PORT = "3000"

[phases.setup]
nixPkgs = ["nodejs_20", "ffmpeg"]
cmds = ["npm install -g pnpm@9"]

[phases.install]
dependsOn = ["setup"]
cmds = ["pnpm install --frozen-lockfile"]

[phases.build]
dependsOn = ["install"]
cmds = ["pnpm --filter @workspace/api-server build"]

[start]
cmd = "node -e \"const{Pool}=require('pg');const p=new Pool({connectionString:process.env.DATABASE_URL});p.query(\\\"ALTER TABLE users ADD COLUMN IF NOT EXISTS student_number VARCHAR(20)\\\").then(()=>{console.log('migration ok');p.end();}).catch(e=>{console.error('migration warn:',e.message);p.end();})\" 2>/dev/null; /usr/local/bin/pnpm --filter @workspace/db push --force 2>/dev/null; node --enable-source-maps artifacts/api-server/dist/index.mjs"
