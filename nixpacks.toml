parked','kindled','triggered','all of the above'],'all of the above'],['He is a person of ___ integrity.',['impeccable','faultless','stainless','whole'],'impeccable'],['The city is a ___ of different cultures.',['melting pot','crossroads','hub','mosaic'],'melting pot'],['Lest we ___, let us write down the plan.',['forget','should forget','forgot','will forget'],'should forget']]};async function run(){const c=await p.connect();try{for(const lv of levels){const ex=await c.query('SELECT id FROM quizzes WHERE level=$1 LIMIT 1',[lv]);if(ex.rows.length>0){console.log('quiz exists:'+lv);continue;}const r=await c.query('INSERT INTO quizzes(title,level,time_limit,passing_score)VALUES($1,$2,$3,$4)RETURNING id',[titles[lv],lv,limits[lv],passing[lv]]);const qid=r.rows[0].id;for(const[q,opts,ans]of questions[lv]){await c.query('INSERT INTO questions(quiz_id,type,question,options,correct_answer,points)VALUES($1,$2,$3,$4,$5,$6)',[qid,'multiple_choice',q,JSON.stringify(opts),ans,10]);}console.log('seeded:'+lv);}}catch(e){console.error('seed err:',e.message);}finally{c.release();await p.end();}}run();\" 2>/dev/null;  node --enable-source-maps artifacts/api-server/dist/index.mjs"
