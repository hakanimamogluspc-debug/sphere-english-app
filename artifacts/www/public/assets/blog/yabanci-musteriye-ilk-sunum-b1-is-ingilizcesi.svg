  <line x1="260" y1="260" x2="260" y2="290" stroke="#22d3ee" stroke-width="3" opacity="0.5"/>
  <rect x="220" y="288" width="80" height="8" rx="4" fill="#22d3ee" opacity="0.4"/>
  <!-- Presenter figure -->
  <circle cx="460" cy="170" r="22" fill="#22d3ee" opacity="0.6"/>
  <path d="M438 200 Q460 190 482 200 L485 270 L435 270 Z" fill="#22d3ee" opacity="0.4"/>
  <!-- Pointer arrow -->
  <line x1="440" y1="190" x2="390" y2="220" stroke="#f0f9ff" stroke-width="2" stroke-dasharray="5,3" opacity="0.6"/>
  <circle cx="388" cy="221" r="4" fill="#22d3ee" opacity="0.7"/>
  <rect x="0" y="360" width="580" height="40" fill="url(#accent)" opacity="0.15"/>
