<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 400" width="580" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1628"/>
      <stop offset="100%" style="stop-color:#0d1f3c"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0891b2"/>
      <stop offset="100%" style="stop-color:#22d3ee"/>
    </linearGradient>
  </defs>
  <rect width="580" height="400" fill="url(#bg)"/>
  <circle cx="500" cy="80" r="110" fill="#0891b2" opacity="0.07"/>
  <circle cx="80" cy="350" r="100" fill="#22d3ee" opacity="0.05"/>
  <circle cx="140" cy="130" r="2" fill="#f0f9ff" opacity="0.28"/>
  <circle cx="460" cy="300" r="1" fill="#f0f9ff" opacity="0.33"/>
  <circle cx="520" cy="160" r="2" fill="#f0f9ff" opacity="0.22"/>
  <circle cx="60" cy="250" r="1" fill="#f0f9ff" opacity="0.30"/>
  <rect x="0" y="0" width="580" height="4" fill="#0891b2" opacity="0.7"/>
  <!-- C1 Badge -->
  <rect x="30" y="30" width="70" height="35" rx="8" fill="#0891b2" opacity="0.3"/>
  <rect x="30" y="30" width="70" height="35" rx="8" fill="none" stroke="#22d3ee" stroke-width="1.5" opacity="0.6"/>
  <text x="65" y="54" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#22d3ee">C1</text>
  <!-- Report document -->
  <rect x="100" y="70" width="160" height="220" rx="8" fill="#0f2040" stroke="#22d3ee" stroke-width="1.5" opacity="0.9"/>
  <!-- Document lines -->
  <rect x="118" y="95" width="120" height="8" rx="3" fill="#22d3ee" opacity="0.6"/>
  <rect x="118" y="115" width="90" height="5" rx="2" fill="#f0f9ff" opacity="0.25"/>
  <rect x="118" y="128" width="105" height="5" rx="2" fill="#f0f9ff" opacity="0.20"/>
  <rect x="118" y="141" width="80" height="5" rx="2" fill="#f0f9ff" opacity="0.18"/>
  <!-- Mini chart in document -->
  <rect x="118" y="160" width="30" height="50" rx="2" fill="#0891b2" opacity="0.5"/>
  <rect x="155" y="175" width="30" height="35" rx="2" fill="#22d3ee" opacity="0.5"/>
  <rect x="192" y="155" width="30" height="55" rx="2" fill="#0891b2" opacity="0.7"/>
  <!-- Board room table -->
  <ellipse cx="400" cy="240" rx="130" ry="55" fill="#0f2040" stroke="#0891b2" stroke-width="1.5" opacity="0.7"/>
  <!-- Board members -->
  <circle cx="290" cy="185" r="16" fill="#f0f9ff" opacity="0.25"/>
  <circle cx="340" cy="175" r="16" fill="#f0f9ff" opacity="0.2"/>
  <circle cx="400" cy="170" r="16" fill="#22d3ee" opacity="0.6"/>
  <circle cx="460" cy="175" r="16" fill="#f0f9ff" opacity="0.2"/>
  <circle cx="510" cy="185" r="16" fill="#f0f9ff" opacity="0.25"/>
  <circle cx="290" cy="295" r="14" fill="#f0f9ff" opacity="0.18"/>
  <circle cx="510" cy="295" r="14" fill="#f0f9ff" opacity="0.18"/>
  <!-- Arrow connecting doc to board -->
  <path d="M260 180 Q300 180 290 195" stroke="#22d3ee" stroke-width="2" fill="none" stroke-dasharray="5,3" opacity="0.5" marker-end="url(#arrow)"/>
  <rect x="0" y="360" width="580" height="40" fill="url(#accent)" opacity="0.15"/>
</svg>
