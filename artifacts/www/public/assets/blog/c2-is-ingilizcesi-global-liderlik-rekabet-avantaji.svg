<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 400" width="580" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1628"/>
      <stop offset="100%" style="stop-color:#0d1f3c"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0891b2"/>
      <stop offset="100%" style="stop-color:#22d3ee"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#fbbf24"/>
    </linearGradient>
  </defs>
  <rect width="580" height="400" fill="url(#bg)"/>
  <circle cx="290" cy="200" r="180" fill="#0891b2" opacity="0.05"/>
  <circle cx="290" cy="200" r="130" fill="none" stroke="#22d3ee" stroke-width="0.5" opacity="0.15" stroke-dasharray="6,6"/>
  <circle cx="290" cy="200" r="80" fill="none" stroke="#22d3ee" stroke-width="0.5" opacity="0.1" stroke-dasharray="4,4"/>
  <circle cx="100" cy="60" r="2" fill="#f0f9ff" opacity="0.28"/>
  <circle cx="480" cy="50" r="1" fill="#f0f9ff" opacity="0.33"/>
  <circle cx="540" cy="300" r="2" fill="#f0f9ff" opacity="0.22"/>
  <circle cx="50" cy="320" r="1" fill="#f0f9ff" opacity="0.30"/>
  <circle cx="150" cy="350" r="1" fill="#f0f9ff" opacity="0.25"/>
  <rect x="0" y="0" width="580" height="4" fill="#0891b2" opacity="0.7"/>
  <!-- C2 Badge — most prestigious -->
  <rect x="30" y="30" width="75" height="38" rx="8" fill="url(#goldGrad)" opacity="0.25"/>
  <rect x="30" y="30" width="75" height="38" rx="8" fill="none" stroke="#f59e0b" stroke-width="2" opacity="0.7"/>
  <text x="67" y="56" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#fbbf24">C2</text>
  <!-- Globe -->
  <circle cx="290" cy="200" r="95" fill="none" stroke="#22d3ee" stroke-width="2" opacity="0.35"/>
  <ellipse cx="290" cy="200" rx="50" ry="95" fill="none" stroke="#22d3ee" stroke-width="1" opacity="0.2"/>
  <line x1="195" y1="200" x2="385" y2="200" stroke="#22d3ee" stroke-width="1" opacity="0.2"/>
  <line x1="205" y1="158" x2="375" y2="158" stroke="#22d3ee" stroke-width="0.8" opacity="0.15"/>
  <line x1="205" y1="242" x2="375" y2="242" stroke="#22d3ee" stroke-width="0.8" opacity="0.15"/>
  <!-- Crown / trophy on top -->
  <polygon points="290,60 265,90 275,90 260,120 290,105 320,120 305,90 315,90" fill="#f59e0b" opacity="0.7"/>
  <circle cx="290" cy="200" r="18" fill="#22d3ee" opacity="0.7"/>
  <!-- Connection dots on globe (cities) -->
  <circle cx="240" cy="170" r="5" fill="#22d3ee" opacity="0.8"/>
  <circle cx="350" cy="185" r="5" fill="#22d3ee" opacity="0.7"/>
  <circle cx="220" cy="230" r="4" fill="#0891b2" opacity="0.7"/>
  <circle cx="360" cy="225" r="4" fill="#0891b2" opacity="0.7"/>
  <!-- Connection lines between cities -->
  <line x1="240" y1="170" x2="350" y2="185" stroke="#22d3ee" stroke-width="1.5" opacity="0.4" stroke-dasharray="3,3"/>
  <line x1="240" y1="170" x2="220" y2="230" stroke="#22d3ee" stroke-width="1.5" opacity="0.3" stroke-dasharray="3,3"/>
  <line x1="350" y1="185" x2="360" y2="225" stroke="#22d3ee" stroke-width="1.5" opacity="0.35" stroke-dasharray="3,3"/>
  <line x1="220" y1="230" x2="360" y2="225" stroke="#22d3ee" stroke-width="1.5" opacity="0.3" stroke-dasharray="3,3"/>
  <rect x="0" y="360" width="580" height="40" fill="url(#accent)" opacity="0.15"/>
</svg>
