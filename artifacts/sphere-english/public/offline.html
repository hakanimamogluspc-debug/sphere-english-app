<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#1B365D" />
  <title>Bağlantı yok — Sphere English</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
           font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f5f8fc; color: #1B365D; padding: 24px; }
    .card { background: #fff; border-radius: 20px; padding: 36px 28px; max-width: 380px; width: 100%; text-align: center;
            box-shadow: 0 10px 40px rgba(27,54,93,.08); }
    img { width: 72px; height: 72px; border-radius: 18px; margin-bottom: 18px; }
    h1 { font-size: 22px; margin: 0 0 10px; }
    p { color: #64748b; font-size: 15px; line-height: 1.55; margin: 0 0 24px; }
    button { width: 100%; padding: 14px; border: 0; border-radius: 12px; background: #1B365D; color: #fff; font-size: 15px; font-weight: 700; cursor: pointer; }
    button:active { opacity: .85; }
    .hint { font-size: 12px; color: #94a3b8; margin-top: 16px; }
  </style>
</head>
<body>
  <div class="card">
    <img src="/icons/icon-192.png" alt="Sphere English" />
    <h1>Bağlantı yok</h1>
    <p>İnternet bağlantın kesilmiş görünüyor. Bağlantı gelince kaldığın yerden devam edebilirsin.</p>
    <button onclick="location.reload()">Tekrar dene</button>
    <div class="hint" id="hint">Bağlantı geri geldiğinde otomatik yenilenecek.</div>
  </div>
  <script>
    window.addEventListener("online", function () { location.reload(); });
  </script>
</body>
</html>
